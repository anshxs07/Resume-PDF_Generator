<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resume — JSON → Preview → PDF</title>

  
  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.7/dist/handlebars.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Resume Builder — JSON → Preview → PDF</h1>
      <p>Paste a resume JSON, preview it, then generate a PDF.</p>
    </header>

    <section class="controls">
      <div class="left">
        <label for="jsonInput">Resume JSON</label>
        <textarea id="jsonInput" placeholder="Paste JSON here" spellcheck="false"></textarea>

        <div class="control-row">
          <input type="file" id="jsonFile" accept=".json" />
          <button id="previewBtn" class="btn">Preview Resume</button>
          <button id="pdfBtn" class="btn primary">Generate PDF</button>
          <label class="auto-label"><input type="checkbox" id="autoPreview" /> Auto-preview</label>
          <button id="resetBtn" class="btn muted">Reset</button>
        </div>

        <div id="error" class="error" aria-live="polite"></div>
      </div>

      <div class="right instructions">
        <h4>Sample JSON </h4>
        <pre id="sampleJson" class="sample"></pre>
        <p class="muted small">Tip: Use the sample as a starting point. Click <strong>Preview Resume</strong> to render and <strong>Generate PDF</strong> to download.</p>
      </div>
    </section>

    <section class="preview-section">
      <h2>Preview</h2>
     
      <div id="preview" class="paper A4">
       
      </div>
    </section>
  </div>

  <!-- Handlebars template -->
  <script id="resume-template" type="text/x-handlebars-template">
    <div class="resume">
      <aside class="sidebar">
        <div class="name-row">
          <div class="full-name">{{name}}</div>
          <div class="title">{{title}}</div>
        </div>

        {{#if contact}}
        <div class="section contact">
          <h3>Contact</h3>
          {{#if contact.email}}<div>{{contact.email}}</div>{{/if}}
          {{#if contact.phone}}<div>{{contact.phone}}</div>{{/if}}
          {{#if contact.linkedin}}<div>{{contact.linkedin}}</div>{{/if}}
        </div>
        {{/if}}

        {{#if skills}}
        <div class="section">
          <h3>Skills</h3>
          <div class="skills">
            {{#each skills}}
              <div class="skill-pill">{{this}}</div>
            {{/each}}
          </div>
        </div>
        {{/if}}

        {{#if projects}}
        <div class="section">
          <h3>Projects</h3>
          <div class="projects">
            {{#each projects}}
              <div class="project"><b>{{title}}</b><small class="muted"> • {{description}}</small></div>
            {{/each}}
          </div>
        </div>
        {{/if}}
      </aside>

      <main class="main">
        {{#if summary}}
        <div class="summary section">
          <h3>Summary</h3>
          <p>{{summary}}</p>
        </div>
        {{/if}}

        {{#if experience}}
        <div class="section experience">
          <h3>Experience</h3>
          {{#each experience}}
            <div class="job">
              <div class="job-header">
                <div class="company-role">
                  <div class="company">{{company}}</div>
                  <div class="role">{{role}}</div>
                </div>
                <div class="dates">{{dates}}</div>
              </div>
              <p>{{description}}</p>
            </div>
          {{/each}}
        </div>
        {{/if}}

        {{#if education}}
        <div class="section education">
          <h3>Education</h3>
          {{#each education}}
            <div class="edu-item">
              <div>
                <div class="company">{{school}}</div>
                <div class="role muted">{{degree}}</div>
              </div>
              <div class="dates">{{dates}}</div>
            </div>
          {{/each}}
        </div>
        {{/if}}
      </main>
    </div>
  </script>


  <script src="script.js"></script>
</body>
</html>
